<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#102a43">
    <title>Cranford Cougars Playbook</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="assets/icons/icon-192.png" alt="" class="brand-mark">
        <div>
          <p class="eyebrow">2026 8th Grade PAL</p>
          <h1>Cranford Cougars</h1>
        </div>
      </div>
      <button id="installButton" class="icon-text hidden" type="button" aria-label="Install app">Install</button>
    </header>

    <main class="playbook">
      <section class="controls" aria-label="Play filters">
        <label class="search">
          <span>Search</span>
          <input id="searchInput" type="search" inputmode="search" autocomplete="off" placeholder="Play, tag, position">
        </label>
        <div class="segments" role="tablist" aria-label="Filter plays">
          <button class="segment active" type="button" data-filter="All">All</button>
          <button class="segment" type="button" data-filter="Option">Option</button>
          <button class="segment" type="button" data-filter="TE">TE</button>
          <button class="segment" type="button" data-filter="WR">WR</button>
          <button class="segment" type="button" data-filter="Backfield">Backfield</button>
        </div>
      </section>

      <section class="workspace">
        <aside class="playlist" aria-label="Play list">
          <div class="list-heading">
            <span id="playCount"></span>
            <a href="assets/source/8th-grade-pal-offense.pdf" target="_blank" rel="noreferrer">PDF</a>
          </div>
          <div id="playList" class="play-list"></div>
        </aside>

        <section class="viewer" aria-live="polite">
          <div class="viewer-header">
            <div>
              <h2 id="activeTitle">Play 01</h2>
            </div>
          </div>
          <div class="diagram-frame">
            <img id="playImage" alt="Selected Cranford Cougars play diagram">
          </div>
        </section>
      </section>
    </main>

    <script src="app.js" type="module"></script>
  </body>
</html>
